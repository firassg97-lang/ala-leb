name: lebesty
description: Lebesty - Tunisian clothing sale and rental marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_grid_view: ^0.7.0

  # Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  nsfw_detector_flutter: ^2.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Maps & Location
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Audio (Voice Messages)
  record: ">=5.0.0 <5.1.0"
  just_audio: ^0.9.42

  # Ads
  google_mobile_ads: ^6.0.0
  app_tracking_transparency: ^2.0.7

  # Notifications
  firebase_core: ^3.13.0
  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.2.5

  # Auth
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2

  # Storage & Cache
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Utils
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  timeago: ^3.7.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  visibility_detector: ^0.4.0+2

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lebesty_logo.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/